{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(to right, #a3c5e3, #5f88b5);
            height: 100vh;
        }
        .sidebar {
            width: 250px;
            height: 100vh;
            background-color: #333;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding: 20px;
        }
        .sidebar h3 {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid white;
            padding-bottom: 10px;
        }
        .sidebar p {
            margin: 5px 0;
            font-size: 14px;
        }
        .main-content {
            margin-left: 260px; /* Adjust for sidebar width */
            padding: 20px;
        }
        .card {
            width: 150px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .card:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h3>Staff Details</h3>
        <p><strong>Name:</strong>{{username}}</p>
        <p><strong>Staff ID:</strong>{{staffid}}</p>
        <p><strong>Department:</strong> {{ dept }}</p>
        <p><strong>Email:</strong>{{emailid}}</p>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="d-flex justify-content-center gap-3 flex-wrap">
            <a href="{% url 'create_test' %}" class="text-decoration-none">
                <div class="card bg-warning text-dark">Create test</div>
            </a>
            <a href="{% url 'evaluate_test' %}" class="text-decoration-none">
                <div class="card bg-danger text-light">Evaluate test</div>
            </a>
            <a href="{% url 'class_group' %}" class="text-decoration-none">
                <div class="card bg-warning text-dark">Class group</div>
            </a>
            <a href="{% url 'test_details' %}" class="text-decoration-none">
                <div class="card bg-danger text-light">Test details</div>
            </a>
            <a href="{% url 'manage_enrollments' test_id=1 %}" class="text-decoration-none">
                <div class="card bg-success text-light">Manage Enrollments</div>
            </a>
        </div>
    </div>
</body>
</html>
