<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Online Exam Portal{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(to right, #a3c5e3, #5f88b5);
            min-height: 100vh;
        }
        .sidebar {
            width: 250px;
            height: 100vh;
            background-color: #333;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding: 20px;
        }
        .sidebar h3 {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid white;
            padding-bottom: 10px;
        }
        .sidebar p {
            margin: 5px 0;
            font-size: 14px;
        }
        .main-content {
            margin-left: 260px; /* Adjust for sidebar width */
            padding: 20px;
        }
        .card {
            width: 150px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .alert {
            margin-top: 20px;
        }
        .enrollment-row {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 40px;
            margin-top: 30px;
            margin-bottom: 30px;
        }
        .enrollment-card {
            width: 350px;
            min-height: 350px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .enrollment-card .card-header {
            border-radius: 18px 18px 0 0;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 18px 0;
        }
        .enrollment-card .card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 24px 16px;
        }
        .enrollment-card .list-group-item {
            margin-bottom: 10px;
            border: none;
            background: none;
        }
        .enrollment-card .empty-message {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #888;
            min-height: 120px;
        }
        @media (max-width: 900px) {
            .enrollment-row {
                flex-direction: column;
                align-items: center;
                gap: 24px;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% if username %}
    <!-- Sidebar -->
    <div class="sidebar">
        <h3>Staff Details</h3>
        <p><strong>Name:</strong> {{ username }}</p>
        <p><strong>Staff ID:</strong> {{ staffid }}</p>
        <p><strong>Department:</strong> {{ dept }}</p>
        <p><strong>Email:</strong> {{ emailid }}</p>
    </div>
    {% endif %}

    <!-- Main Content -->
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
